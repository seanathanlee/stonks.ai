---
# ============================================================
# Stonks.ai — Snapshot Agent Forecast (Manual Trigger)
# ============================================================
#
# Triggered manually via workflow_dispatch.  Runs the parent
# agent for each of the last N days (default: 30), treating
# each calendar day as "today" so that forecasts are generated
# from the price data available on that day and written to the
# ADX `agentStockForecast` table with the correct reportTime.
#
# Use this workflow to:
#   • Backfill forecasts when the agent has not previously run.
#   • Re-seed forecast data after downtime or data loss.
#
# Note: Price data for the target window must already exist in
# ADX.  Run the Snapshot Stock Price Scrape workflow first if
# needed.
#
# Required repository secrets:
#   ADX_CLUSTER_URI       – ADX cluster URI
#                           e.g. https://stonksaiadx.eastus.kusto.windows.net
#   ADX_DATABASE          – ADX database name (default: stonksai)
#   AZURE_CLIENT_ID       – Service principal / managed identity client ID (OIDC)
#   AZURE_TENANT_ID       – Azure tenant ID
#   AZURE_SUBSCRIPTION_ID – Azure subscription ID
#   AZURE_OPENAI_ENDPOINT – Azure OpenAI endpoint
#   AZURE_OPENAI_API_KEY  – Azure OpenAI API key
# ============================================================

name: Snapshot Agent Forecast

"on":
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to back-fill (default: 30)"
        required: false
        default: "30"
        type: string

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  snapshot-forecast:
    name: Backfill forecast snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run parent agent for each day in snapshot window
        env:
          ADX_CLUSTER_URI: ${{ secrets.ADX_CLUSTER_URI }}
          ADX_DATABASE: ${{ secrets.ADX_DATABASE || 'stonksai' }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          DAYS="${{ inputs.days || '30' }}"
          for i in $(seq 0 $(( DAYS - 1 ))); do
            TARGET_DATE=$(date -u -d "${i} days ago" +%Y-%m-%d)
            echo "--- Forecasting for date: ${TARGET_DATE} ---"
            python -m agents.parent_agent --date "${TARGET_DATE}"
          done
