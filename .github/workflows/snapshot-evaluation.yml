---
# ============================================================
# Stonks.ai — Snapshot Evaluation Agent (Manual Trigger)
# ============================================================
#
# Triggered manually via workflow_dispatch.  Runs the evaluation
# agent for each day in the specified date range, treating each
# calendar day as "today" so that forecasts made 30 days before
# that day are evaluated and written to the ADX
# `agentStockEvaluation` table.
#
# Each date runs as a separate matrix job, so Azure OIDC
# authentication is refreshed per date and a failure on one
# date does not block the remaining dates.
#
# Use this workflow to:
#   • Backfill evaluations when the agent has not previously run.
#   • Re-seed evaluation data after downtime or data loss.
#   • Resume from a specific date after a partial failure.
#
# Required repository secrets:
#   ADX_CLUSTER_URI       – ADX cluster URI
#                           e.g. https://stonksaiadx.eastus.kusto.windows.net
#   ADX_DATABASE          – ADX database name (default: stonksai)
#   AZURE_CLIENT_ID       – Service principal / managed identity client ID (OIDC)
#   AZURE_TENANT_ID       – Azure tenant ID
#   AZURE_SUBSCRIPTION_ID – Azure subscription ID
# ============================================================

name: Snapshot Agent Evaluation

"on":
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to back-fill when start_date is not set (default: 30)"
        required: false
        default: "30"
        type: string
      start_date:
        description: "Start date (YYYY-MM-DD). Overrides 'days' when provided."
        required: false
        type: string
      end_date:
        description: "End date (YYYY-MM-DD, inclusive). Defaults to today when not set."
        required: false
        type: string

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  generate-dates:
    name: Generate date list
    runs-on: ubuntu-latest
    outputs:
      dates: ${{ steps.dates.outputs.dates }}
    steps:
      - name: Generate date list
        id: dates
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import date, timedelta

          start_date = "${{ inputs.start_date }}"
          end_date = "${{ inputs.end_date }}"
          days = int("${{ inputs.days }}" or "30")

          end = date.fromisoformat(end_date) if end_date else date.today()
          start = date.fromisoformat(start_date) if start_date else end - timedelta(days=days - 1)

          dates = [str(start + timedelta(days=i)) for i in range((end - start).days + 1)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("dates=" + json.dumps(dates) + "\n")
          PYEOF

  snapshot-evaluation:
    name: Evaluate for ${{ matrix.date }}
    needs: generate-dates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        date: ${{ fromJson(needs.generate-dates.outputs.dates) }}
      max-parallel: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run evaluation agent for ${{ matrix.date }}
        env:
          ADX_CLUSTER_URI: ${{ secrets.ADX_CLUSTER_URI }}
          ADX_DATABASE: ${{ secrets.ADX_DATABASE || 'stonksai' }}
        run: |
          echo "--- Evaluating for date: ${{ matrix.date }} ---"
          python -m agents.evaluation_agent --date "${{ matrix.date }}"
