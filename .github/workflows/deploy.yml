---
# ============================================================
# Stonks.ai — Deploy Azure infrastructure + backend + frontend
# ============================================================
#
# This workflow:
#   1. Provisions the Azure Container Registry (ACR) alone so
#      the real image can be pushed before the full Bicep deploy.
#   2. Builds the Docker image and pushes it to ACR.
#   3. Deploys the full Azure infrastructure (AI Services, ADX,
#      Container App, Static Web App) using the Bicep template
#      in infra/, passing the real image URI as a parameter so
#      no placeholder image is ever used.
#   4. Injects the Container App URL into the frontend and
#      deploys the frontend/ directory to Azure Static Web Apps
#      (served at skewthis.com).
#
# Required repository secrets:
#   AZURE_CLIENT_ID          – Service principal / managed identity
#                              client ID (OIDC)
#   AZURE_TENANT_ID          – Azure tenant ID
#   AZURE_SUBSCRIPTION_ID    – Azure subscription ID
#   AZURE_RESOURCE_GROUP     – Name of the target resource group
#   AZURE_OPENAI_API_KEY     – Azure OpenAI API key
#
# Optional repository variables (with defaults):
#   BASE_NAME     – defaults to stonksai
#   SWA_LOCATION  – defaults to centralus
# ============================================================

name: Deploy to Azure

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  provision-acr:
    name: Provision Azure Container Registry
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}

    outputs:
      acr_login_server: ${{ steps.acr.outputs.acrLoginServer }}
      acr_name: ${{ steps.acr.outputs.acrName }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ACR
        id: acr
        run: |
          RESULT=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file ./infra/acr-only.bicep \
            --parameters baseName="${{ vars.BASE_NAME || 'stonksai' }}" \
            --query properties.outputs \
            --output json)
          echo "acrLoginServer=$(echo "$RESULT" | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "acrName=$(echo "$RESULT" | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push Docker image to ACR
    runs-on: ubuntu-latest
    needs: provision-acr
    defaults:
      run:
        shell: bash -euo pipefail {0}

    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.BASE_NAME || 'stonksai' }}acr"

      - name: Build and push Docker image
        id: push
        run: |
          ACR="${{ vars.BASE_NAME || 'stonksai' }}acr.azurecr.io"
          IMAGE="${ACR}/stonksai:latest"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  deploy-infrastructure:
    name: Deploy Azure infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        shell: bash -euo pipefail {0}

    outputs:
      container_app_fqdn: ${{ steps.bicep.outputs.containerAppFqdn }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: bicep
        run: |
          RESULT=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file ./infra/main.bicep \
            --parameters \
              baseName="${{ vars.BASE_NAME || 'stonksai' }}" \
              swaLocation="${{ vars.SWA_LOCATION || 'centralus' }}" \
              azureOpenAIApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              containerImage="${{ needs.build-and-push.outputs.image }}" \
            --query properties.outputs \
            --output json)
          echo "containerAppFqdn=$(echo "$RESULT" | jq -r '.containerAppFqdn.value')" \
            >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inject Container App URL into frontend
        run: |
          FQDN="${{ needs.deploy-infrastructure.outputs.container_app_fqdn }}"
          API_URL="https://${FQDN}"
          echo "Setting API_BASE to ${API_URL}"
          sed -i "s|const API_BASE = '';|const API_BASE = '${API_URL}';|" frontend/index.html

      - name: Get Static Web App deployment token
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.BASE_NAME || 'stonksai' }}-web" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to retrieve Static Web App deployment token." >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: frontend
          skip_app_build: true
