---
# ============================================================
# Stonks.ai — Deploy AI Agent to Azure
# ============================================================
#
# This workflow:
#   1. Builds the Docker image and pushes it to Azure Container
#      Registry (ACR).
#   2. Deploys the Azure infrastructure using Bicep.
#   3. Updates the Container App with the new image.
#
# Required repository secrets:
#   AZURE_CLIENT_ID       – Service principal / managed identity
#                           client ID (OIDC)
#   AZURE_TENANT_ID       – Azure tenant ID
#   AZURE_SUBSCRIPTION_ID – Azure subscription ID
#   AZURE_RESOURCE_GROUP  – Name of the target resource group
#   ACR_LOGIN_SERVER      – e.g. stonksaiacr.azurecr.io
#   AZURE_OPENAI_ENDPOINT – Azure OpenAI endpoint URL
#   AZURE_OPENAI_API_KEY  – Azure OpenAI API key
#
# Optional repository variables (with defaults):
#   AZURE_OPENAI_DEPLOYMENT – defaults to gpt-4o
#   BASE_NAME               – defaults to stonksai
# ============================================================

name: Deploy to Azure

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

env:
  IMAGE_NAME: stonksai-agent

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          # az acr login --name expects the registry name only (no domain)
          REGISTRY_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          az acr login --name "${REGISTRY_NAME%.azurecr.io}"

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ secrets.ACR_LOGIN_SERVER }}"
          TAG="${TAG}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.tag }}" \
            --tag \
              "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.meta.outputs.tag }}"
          docker push \
            "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"

  deploy-infrastructure:
    name: Deploy Azure infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            baseName=${{ vars.BASE_NAME || 'stonksai' }}
            containerImage=${{ needs.build-and-push.outputs.image_tag }}
            azureOpenAiEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            azureOpenAiApiKey=${{ secrets.AZURE_OPENAI_API_KEY }}
            azureOpenAiDeployment=
              ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-4o' }}
          failOnStdErr: false
