---
# ============================================================
# Stonks.ai — Deploy Azure Cognitive Services
# ============================================================
#
# This workflow deploys the Azure AI Services (Cognitive
# Services) account using the Bicep template in infra/.
#
# Required repository secrets:
#   AZURE_CLIENT_ID       – Service principal / managed identity
#                           client ID (OIDC)
#   AZURE_TENANT_ID       – Azure tenant ID
#   AZURE_SUBSCRIPTION_ID – Azure subscription ID
#   AZURE_RESOURCE_GROUP  – Name of the target resource group
#
# Optional repository variables (with defaults):
#   BASE_NAME – defaults to stonksai
# ============================================================

name: Deploy to Azure

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  deploy-infrastructure:
    name: Deploy Azure infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            baseName=${{ vars.BASE_NAME || 'stonksai' }}
          failOnStdErr: false
