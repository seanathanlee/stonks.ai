---
# ============================================================
# Stonks.ai — Deploy Azure infrastructure + frontend
# ============================================================
#
# This workflow:
#   1. Deploys the Azure infrastructure (AI Services, ADX,
#      Static Web App) using the Bicep template in infra/.
#   2. Deploys the frontend/ directory to Azure Static Web Apps
#      (served at skewthis.com).
#
# Required repository secrets:
#   AZURE_CLIENT_ID       – Service principal / managed identity
#                           client ID (OIDC)
#   AZURE_TENANT_ID       – Azure tenant ID
#   AZURE_SUBSCRIPTION_ID – Azure subscription ID
#   AZURE_RESOURCE_GROUP  – Name of the target resource group
#
# Optional repository variables (with defaults):
#   BASE_NAME     – defaults to stonksai
#   SWA_LOCATION  – defaults to centralus
# ============================================================

name: Deploy to Azure

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  deploy-infrastructure:
    name: Deploy Azure infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            baseName=${{ vars.BASE_NAME || 'stonksai' }}
            swaLocation=${{ vars.SWA_LOCATION || 'centralus' }}
          failOnStdErr: false

  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Static Web App deployment token
        id: swa-token
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.BASE_NAME || 'stonksai' }}-web" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to retrieve Static Web App deployment token." >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: frontend
          skip_app_build: true
