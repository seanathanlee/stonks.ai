<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stonks.ai — AI Stock Analysis</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f172a;
      --surface:    #1e293b;
      --surface-2:  #334155;
      --border:     #334155;
      --text:       #f1f5f9;
      --text-muted: #94a3b8;
      --accent:     #3b82f6;
      --accent-dim: #1d4ed8;
      --user-bg:    #1d4ed8;
      --bot-bg:     #1e293b;
      --green:      #22c55e;
      --red:        #ef4444;
      --radius:     12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header p  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-left: auto;
      flex-shrink: 0;
    }
    #status-dot.busy { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .4; }
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 100%;
    }
    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .message.user   .avatar { background: var(--user-bg); }
    .message.bot    .avatar { background: var(--surface-2); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      max-width: 78%;
      word-break: break-word;
    }
    .message.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble p + p { margin-top: 8px; }
    .bubble ul { padding-left: 20px; }
    .bubble li { margin: 3px 0; }
    .bubble strong { color: var(--text); }
    .bubble code {
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13px;
    }

    /* Charts inside bubbles */
    .charts-wrap {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chart-card {
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .chart-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .chart-card canvas { max-height: 280px; }

    /* Typing indicator */
    .typing-indicator .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }
    .typing-indicator .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator .dot:nth-child(2) { animation-delay: .2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity:.6; }
      40%          { transform: translateY(-6px); opacity:1; }
    }

    /* ── Suggestions ── */
    #suggestions {
      padding: 0 20px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggestion-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .suggestion-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    /* ── Input bar ── */
    #input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      outline: none;
      transition: border-color .15s;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: var(--accent-dim); }
    #send-btn:disabled { background: var(--surface-2); cursor: not-allowed; }

    /* Scrollbar */
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">📈</div>
    <div>
      <h1>Stonks.ai</h1>
      <p>Multi-agent stock analysis</p>
    </div>
    <span id="status-dot" title="Ready"></span>
  </header>

  <div id="messages"></div>

  <div id="suggestions">
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Show top picks for next month</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Run full analysis</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Compare agents on AAPL</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Show MSFT price history</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Best 1-year picks</button>
  </div>

  <div id="input-area">
    <textarea
      id="user-input"
      placeholder="Ask about stocks, forecasts, or run an analysis…"
      rows="1"
    ></textarea>
    <button id="send-btn" title="Send" onclick="sendMessage()">&#9658;</button>
  </div>

</div>

<script>
// ── Session ────────────────────────────────────────────────────────────────
const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2, 11);

// ── Elements ───────────────────────────────────────────────────────────────
const messagesEl   = document.getElementById('messages');
const inputEl      = document.getElementById('user-input');
const sendBtn      = document.getElementById('send-btn');
const statusDot    = document.getElementById('status-dot');
const suggestionsEl = document.getElementById('suggestions');

// ── Chart registry (to destroy before re-render) ───────────────────────────
const chartRegistry = {};

// ── Auto-resize textarea ───────────────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Welcome message ────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  appendBotMessage(
    "👋 Hi! I'm **Stonks.ai**, your multi-agent stock analysis assistant.\n\n" +
    "I coordinate **9 specialised AI agents** — from momentum traders to contrarian investors — " +
    "to analyse NASDAQ stocks and surface the best opportunities.\n\n" +
    "What would you like to explore today? You can:\n" +
    "• Ask me to **run a full analysis** (all 9 agents)\n" +
    "• View the **latest forecasts** for any horizon (1m, 3m, 6m, 1y)\n" +
    "• See **price history** for specific stocks\n" +
    "• **Compare** how different agents rate a stock\n\n" +
    "Just type your question or pick a suggestion below ↓",
    []
  );
});

// ── Send message ───────────────────────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  // Hide suggestions after first interaction
  suggestionsEl.style.display = 'none';

  appendUserMessage(text);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  setBusy(true);
  const typingId = appendTypingIndicator();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID, message: text }),
    });

    removeTypingIndicator(typingId);

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      appendBotMessage(`⚠️ Error: ${err.detail || 'Something went wrong.'}`, []);
    } else {
      const data = await res.json();
      appendBotMessage(data.reply, data.charts || []);
    }
  } catch (err) {
    removeTypingIndicator(typingId);
    appendBotMessage(`⚠️ Network error: ${err.message}`, []);
  } finally {
    setBusy(false);
  }
}

function sendSuggestion(btn) {
  inputEl.value = btn.textContent;
  sendMessage();
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setBusy(busy) {
  sendBtn.disabled = busy;
  inputEl.disabled = busy;
  statusDot.className = busy ? 'busy' : '';
  statusDot.title = busy ? 'Thinking…' : 'Ready';
}

function appendUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'message user';
  el.innerHTML = `
    <div class="avatar">🧑</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;
  messagesEl.appendChild(el);
  scrollToBottom();
}

function appendBotMessage(text, charts) {
  const el = document.createElement('div');
  el.className = 'message bot';

  const chartsHtml = buildChartsHtml(charts);

  el.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="message-text">${formatMarkdown(text)}</div>
      ${chartsHtml}
    </div>
  `;
  messagesEl.appendChild(el);

  // Render charts after DOM insertion
  if (charts && charts.length) {
    charts.forEach(chart => renderChart(chart));
  }

  scrollToBottom();
}

function appendTypingIndicator() {
  const id = 'typing_' + Date.now();
  const el = document.createElement('div');
  el.className = 'message bot typing-indicator';
  el.id = id;
  el.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;
  messagesEl.appendChild(el);
  scrollToBottom();
  return id;
}

function removeTypingIndicator(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// ── Chart rendering ────────────────────────────────────────────────────────
function buildChartsHtml(charts) {
  if (!charts || !charts.length) return '';
  const cards = charts.map(c => `
    <div class="chart-card">
      <h3>${escapeHtml(c.title)}</h3>
      <canvas id="canvas_${c.id}"></canvas>
    </div>
  `).join('');
  return `<div class="charts-wrap">${cards}</div>`;
}

function renderChart(config) {
  const canvas = document.getElementById('canvas_' + config.id);
  if (!canvas) return;

  // Destroy previous instance if any
  if (chartRegistry[config.id]) {
    chartRegistry[config.id].destroy();
  }

  const isDark = true; // always dark theme
  Chart.defaults.color = '#94a3b8';
  Chart.defaults.borderColor = '#334155';

  const chartConfig = {
    type: config.type,
    data: {
      labels: config.labels,
      datasets: config.datasets,
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          display: config.datasets.length > 1,
          labels: { color: '#94a3b8', boxWidth: 12, padding: 12 },
        },
        tooltip: {
          backgroundColor: '#1e293b',
          borderColor: '#334155',
          borderWidth: 1,
          titleColor: '#f1f5f9',
          bodyColor: '#94a3b8',
          callbacks: {
            label: ctx => {
              const val = ctx.parsed.y ?? ctx.parsed.x;
              return val !== null && val !== undefined
                ? ` ${ctx.dataset.label}: ${Number(val).toFixed(2)}%`
                : ' N/A';
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#64748b', maxRotation: 45 },
          grid:  { color: '#1e293b' },
        },
        y: {
          ticks: { color: '#64748b' },
          grid:  { color: '#1e293b' },
        },
      },
    },
  };

  // Horizontal bar (indexAxis: 'y')
  if (config.indexAxis === 'y') {
    chartConfig.options.indexAxis = 'y';
    chartConfig.options.scales.x.ticks.callback = v => v + '%';
    chartConfig.options.plugins.tooltip.callbacks.label = ctx => {
      const val = ctx.parsed.x;
      return val !== null && val !== undefined
        ? ` ${ctx.dataset.label}: ${Number(val).toFixed(2)}%`
        : ' N/A';
    };
  } else if (config.type === 'line') {
    // Line chart — y axis shows price (no %)
    chartConfig.options.plugins.tooltip.callbacks.label = ctx => {
      const val = ctx.parsed.y;
      return val !== null && val !== undefined
        ? ` ${ctx.dataset.label}: $${Number(val).toFixed(2)}`
        : ' N/A';
    };
    chartConfig.options.scales.y.ticks.callback = v => '$' + Number(v).toFixed(0);
  } else {
    chartConfig.options.scales.y.ticks.callback = v => v + '%';
  }

  chartRegistry[config.id] = new Chart(canvas, chartConfig);
}

// ── Text formatting ────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatMarkdown(text) {
  // Escape HTML first
  let s = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bullet lists (lines starting with • or -)
  s = s.replace(/^[•\-] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>\n?)+/gs, match => `<ul>${match}</ul>`);
  // Newlines → paragraphs
  s = s.split(/\n{2,}/).map(p => {
    if (p.startsWith('<ul>')) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  return s;
}
</script>
</body>
</html>
