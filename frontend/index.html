<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stonks.ai</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #000000;
      --surface:      #1c1c1e;
      --surface-2:    #2c2c2e;
      --surface-3:    #3a3a3c;
      --border:       rgba(255, 255, 255, 0.08);
      --text:         #ffffff;
      --text-muted:   rgba(255, 255, 255, 0.42);
      --accent:       #0071e3;
      --accent-hover: #0077ed;
      --user-bg:      #0071e3;
      --bot-bg:       #1c1c1e;
      --green:        #30d158;
      --red:          #ff453a;
      --radius:       20px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .logo {
      width: 30px;
      height: 30px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    #status-dot.busy { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px 12px;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message {
      display: flex;
      max-width: 100%;
    }
    .message.user { justify-content: flex-end; }
    .message.bot  { justify-content: flex-start; }

    .bubble {
      padding: 10px 15px;
      border-radius: var(--radius);
      max-width: 72%;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.45;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 5px;
      color: #fff;
    }
    .message.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      max-width: 84%;
    }

    .bubble p + p { margin-top: 8px; }
    .bubble ul { padding-left: 20px; margin: 4px 0; }
    .bubble li { margin: 2px 0; }
    .bubble strong { color: var(--text); font-weight: 600; }
    .bubble code {
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 13px;
      font-family: "SF Mono", "Menlo", "Monaco", monospace;
    }

    /* Charts inside bubbles */
    .charts-wrap {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chart-card {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 16px;
    }
    .chart-card h3 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .chart-card canvas { max-height: 260px; }

    /* Typing indicator */
    .typing-indicator .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }
    .typing-indicator .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Suggestions ── */
    #suggestions {
      padding: 12px 24px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggestion-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: -0.1px;
    }
    .suggestion-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    /* ── Input bar ── */
    #input-area {
      padding: 10px 20px 24px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 11px 18px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    #user-input:focus { border-color: rgba(255, 255, 255, 0.22); }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 4px;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled { background: var(--surface-2); cursor: not-allowed; transform: none; }

    #send-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Scrollbar */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-brand">
      <div class="logo">S</div>
      <h1>Stonks.ai</h1>
    </div>
    <span id="status-dot" title="Ready"></span>
  </header>

  <div id="messages"></div>

  <div id="suggestions">
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Top picks this month</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">What should I invest in?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">AAPL breakdown</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">MSFT price history</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Best 1-year picks</button>
  </div>

  <div id="input-area">
    <textarea
      id="user-input"
      placeholder="Ask about any stock…"
      rows="1"
    ></textarea>
    <button id="send-btn" title="Send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20V4M5 11l7-7 7 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</div>

<script>
// ── API base URL ────────────────────────────────────────────────────────────
// Empty string = relative URL (local Docker dev). Replaced at deploy time
// with the absolute Container App URL for the production SWA deployment.
const API_BASE = '';

// ── Session ────────────────────────────────────────────────────────────────
const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2, 11);

// ── Rate-limit constants ───────────────────────────────────────────────────
const MAX_MESSAGE_LENGTH = 2000;
const SEND_COOLDOWN_MS   = 1000; // minimum ms between sends
let   _lastSendTime      = 0;

// ── Elements ───────────────────────────────────────────────────────────────
const messagesEl   = document.getElementById('messages');
const inputEl      = document.getElementById('user-input');
const sendBtn      = document.getElementById('send-btn');
const statusDot    = document.getElementById('status-dot');
const suggestionsEl = document.getElementById('suggestions');

// ── Chart registry (to destroy before re-render) ───────────────────────────
const chartRegistry = {};

// ── Auto-resize textarea ───────────────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Welcome message ────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  appendBotMessage(
    "Hello. Ask me anything about the market — top picks, forecasts, or price history.",
    []
  );
});

// ── Send message ───────────────────────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  // Client-side cooldown guard
  const now = Date.now();
  if (now - _lastSendTime < SEND_COOLDOWN_MS) {
    sendBtn.disabled = true;
    setTimeout(() => { sendBtn.disabled = false; }, SEND_COOLDOWN_MS - (now - _lastSendTime));
    return;
  }

  // Enforce message length cap before sending
  if (text.length > MAX_MESSAGE_LENGTH) {
    appendBotMessage(`⚠️ Message is too long (max ${MAX_MESSAGE_LENGTH} characters).`, []);
    return;
  }

  _lastSendTime = now;

  // Hide suggestions after first interaction
  suggestionsEl.style.display = 'none';

  appendUserMessage(text);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  setBusy(true);
  const typingId = appendTypingIndicator();

  try {
    const res = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID, message: text }),
    });

    removeTypingIndicator(typingId);

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      if (res.status === 429) {
        appendBotMessage(`⚠️ Too many requests — please wait a moment before trying again.`, []);
      } else {
        appendBotMessage(`⚠️ Error: ${err.detail || 'Something went wrong.'}`, []);
      }
    } else {
      const data = await res.json();
      appendBotMessage(data.reply, data.charts || []);
    }
  } catch (err) {
    removeTypingIndicator(typingId);
    appendBotMessage(`⚠️ Network error: ${err.message}`, []);
  } finally {
    setBusy(false);
  }
}

function sendSuggestion(btn) {
  inputEl.value = btn.textContent;
  sendMessage();
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setBusy(busy) {
  sendBtn.disabled = busy;
  inputEl.disabled = busy;
  statusDot.className = busy ? 'busy' : '';
  statusDot.title = busy ? 'Thinking…' : 'Ready';
}

function appendUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'message user';
  el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(el);
  scrollToBottom();
}

function appendBotMessage(text, charts) {
  const el = document.createElement('div');
  el.className = 'message bot';

  const chartsHtml = buildChartsHtml(charts);

  el.innerHTML = `
    <div class="bubble">
      <div class="message-text">${formatMarkdown(text)}</div>
      ${chartsHtml}
    </div>
  `;
  messagesEl.appendChild(el);

  // Render charts after DOM insertion
  if (charts && charts.length) {
    charts.forEach(chart => renderChart(chart));
  }

  scrollToBottom();
}

function appendTypingIndicator() {
  const id = 'typing_' + Date.now();
  const el = document.createElement('div');
  el.className = 'message bot typing-indicator';
  el.id = id;
  el.innerHTML = `
    <div class="bubble">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;
  messagesEl.appendChild(el);
  scrollToBottom();
  return id;
}

function removeTypingIndicator(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// ── Chart rendering ────────────────────────────────────────────────────────
function buildChartsHtml(charts) {
  if (!charts || !charts.length) return '';
  const cards = charts.map(c => `
    <div class="chart-card">
      <h3>${escapeHtml(c.title)}</h3>
      <canvas id="canvas_${c.id}"></canvas>
    </div>
  `).join('');
  return `<div class="charts-wrap">${cards}</div>`;
}

function renderChart(config) {
  const canvas = document.getElementById('canvas_' + config.id);
  if (!canvas) return;

  // Destroy previous instance if any
  if (chartRegistry[config.id]) {
    chartRegistry[config.id].destroy();
  }

  const isDark = true; // always dark theme
  Chart.defaults.color = 'rgba(255,255,255,0.42)';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.08)';

  const chartConfig = {
    type: config.type,
    data: {
      labels: config.labels,
      datasets: config.datasets,
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          display: config.datasets.length > 1,
          labels: { color: 'rgba(255,255,255,0.42)', boxWidth: 12, padding: 12 },
        },
        tooltip: {
          backgroundColor: '#1c1c1e',
          borderColor: 'rgba(255,255,255,0.08)',
          borderWidth: 1,
          titleColor: '#ffffff',
          bodyColor: 'rgba(255,255,255,0.6)',
          callbacks: {
            label: ctx => {
              const val = ctx.parsed.y ?? ctx.parsed.x;
              return val !== null && val !== undefined
                ? ` ${ctx.dataset.label}: ${Number(val).toFixed(2)}%`
                : ' N/A';
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: 'rgba(255,255,255,0.3)', maxRotation: 45 },
          grid:  { color: 'rgba(255,255,255,0.05)' },
        },
        y: {
          ticks: { color: 'rgba(255,255,255,0.3)' },
          grid:  { color: 'rgba(255,255,255,0.05)' },
        },
      },
    },
  };

  // Horizontal bar (indexAxis: 'y')
  if (config.indexAxis === 'y') {
    chartConfig.options.indexAxis = 'y';
    chartConfig.options.scales.x.ticks.callback = v => v + '%';
    chartConfig.options.plugins.tooltip.callbacks.label = ctx => {
      const val = ctx.parsed.x;
      return val !== null && val !== undefined
        ? ` ${ctx.dataset.label}: ${Number(val).toFixed(2)}%`
        : ' N/A';
    };
  } else if (config.type === 'line') {
    // Line chart — y axis shows price (no %)
    chartConfig.options.plugins.tooltip.callbacks.label = ctx => {
      const val = ctx.parsed.y;
      return val !== null && val !== undefined
        ? ` ${ctx.dataset.label}: $${Number(val).toFixed(2)}`
        : ' N/A';
    };
    chartConfig.options.scales.y.ticks.callback = v => '$' + Number(v).toFixed(0);
  } else {
    chartConfig.options.scales.y.ticks.callback = v => v + '%';
  }

  chartRegistry[config.id] = new Chart(canvas, chartConfig);
}

// ── Text formatting ────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatMarkdown(text) {
  // Escape HTML first
  let s = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bullet lists (lines starting with • or -)
  s = s.replace(/^[•\-] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>\n?)+/gs, match => `<ul>${match}</ul>`);
  // Newlines → paragraphs
  s = s.split(/\n{2,}/).map(p => {
    if (p.startsWith('<ul>')) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  return s;
}
</script>
</body>
</html>
